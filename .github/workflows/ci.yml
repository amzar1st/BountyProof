name: Contract checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/genvm-linter
          key: genvm-v0.2.16-linter-0.11.0
      - run: genvm-lint download --version v0.2.16
      - run: python -m pytest -q
      - run: genvm-lint check contracts/bounty_proof.py
      - run: genvm-lint typecheck contracts/bounty_proof.py
